  <text x="770" y="342" fill="#173B37" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="38" font-weight="700">名前や話題性ではなく、やりたいことから。</text>
  <text x="770" y="490" fill="#173B37" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="78" font-weight="700" letter-spacing="1">自分に合うAIを、</text>
  <text x="770" y="594" fill="#173B37" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="78" font-weight="700" letter-spacing="1">用途から選べる。</text>
  <text x="774" y="683" fill="#55706B" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="34" font-weight="500">料金・機能・安全性を、公式情報と実例で整理</text>
  <g transform="translate(774 745)" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="25" font-weight="600">
    <rect width="184" height="62" rx="31" fill="#0F4F46"/><text x="92" y="41" text-anchor="middle" fill="#F7F4ED">用途から探す</text>
    <rect x="202" width="162" height="62" rx="31" fill="#E9F0ED"/><text x="283" y="41" text-anchor="middle" fill="#0F4F46">料金を比較</text>
    <rect x="382" width="162" height="62" rx="31" fill="#FCE9E1"/><text x="463" y="41" text-anchor="middle" fill="#A63F23">安全に使う</text>
  </g>
  <text x="774" y="887" fill="#0F4F46" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="31" font-weight="700">aierabi.jp</text>
