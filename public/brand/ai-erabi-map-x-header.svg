  <rect y="0" width="1500" height="12" fill="#E3663E"/>
  <path d="M1140 88c86 0 150 54 150 128 0 68-47 98-105 123-55 24-84 43-84 91" fill="none" stroke="#F7F4ED" stroke-width="24" stroke-linecap="round" opacity=".18"/>
  <path d="M1101 430c0-83-70-113-127-137-50-21-94-48-94-107 0-53 40-98 98-98" fill="none" stroke="#F7F4ED" stroke-width="24" stroke-linecap="round" opacity=".18"/>
  <circle cx="1140" cy="88" r="24" fill="#E3663E"/>
  <circle cx="978" cy="88" r="18" fill="#F7F4ED" opacity=".72"/>
